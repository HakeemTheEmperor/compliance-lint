name: Publish package

on:
    release:
        types: [published]

permissions:
    contents: read
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - name: Check out the release
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  registry-url: https://registry.npmjs.org
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Test
              run: npm test

            - name: Build
              run: npm run build

            # The repo is a workspace; only the CLI package is published. It is marked
            # "private" until its build bundles the internal @complinter/* packages,
            # so this step intentionally fails until then.
            - name: Publish to npm
              run: npm publish --workspace complinter --provenance --access public
